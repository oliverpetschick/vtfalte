name: Content Promote

on:
  repository_dispatch:
    types: [publish-stand]

permissions:
  contents: write
  statuses: write

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Set Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Promote checked content atomically
        uses: actions/github-script@v8
        env:
          ENABLE_PAGES_ACTIONS: ${{ vars.ENABLE_PAGES_ACTIONS }}
        with:
          script: |
            const { promoteContent } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/promote-content.mjs`);
            await promoteContent({ github, context, core, enabled: process.env.ENABLE_PAGES_ACTIONS === 'true' });
