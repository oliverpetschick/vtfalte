name: Content Publish

on:
  push:
    branches: [cms-content]
  repository_dispatch:
    types: [continue-content-publish]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    outputs:
      deferred: ${{ steps.normalize.outputs.deferred }}
      head: ${{ steps.normalize.outputs.head }}
      no_changes: ${{ steps.normalize.outputs.no_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cms-content
          fetch-depth: 0
      - name: Puffer vorbereiten
        id: normalize
        shell: bash
        run: |
          git fetch origin master
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          changed=false
          if ! git merge-base --is-ancestor origin/master HEAD; then
            git merge --no-edit origin/master
            changed=true
          fi

          while IFS= read -r file; do
            case "$file" in
              src/content/locations/*.json|src/images/folds/fold_*/*.jpg|src/images/folds/fold_*/*.jpeg|src/images/folds/fold_*/*.png)
                ;;
              *)
                echo "Nicht erlaubte CMS-Datei: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only origin/master...HEAD)

          node scripts/prune-media.mjs
          if ! git diff --quiet; then
            git add -A -- src/images
            git commit -m "chore: remove unused location photos"
            changed=true
          fi

          if [ "$changed" = true ]; then
            git push origin HEAD:cms-content
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if git diff --quiet origin/master...HEAD; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prüfstatus setzen
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.normalize.outputs.head }}
          NO_CHANGES: ${{ steps.normalize.outputs.no_changes }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              context: 'vtfalte/content-publish',
              state: process.env.NO_CHANGES === 'true' ? 'success' : 'pending',
              description: process.env.NO_CHANGES === 'true' ? 'Keine offenen Inhaltsänderungen' : 'Prüfung läuft',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Normalisierten Stand erneut prüfen
        if: steps.normalize.outputs.deferred == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'continue-content-publish',
            });

  content-quality:
    needs: normalize
    if: needs.normalize.outputs.deferred != 'true' && needs.normalize.outputs.no_changes != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.normalize.outputs.head }}
          fetch-depth: 0
      - run: git fetch origin master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: CMS-Dateigrenzen prüfen
        run: npm run validate-cms-pr
        env:
          HEAD_REF: cms-content
          BASE_SHA: origin/master
          HEAD_SHA: HEAD
      - run: npm ci
      - name: Inhalte prüfen
        run: npm run validate-content -- --strict-media
      - name: Admin-Hilfen testen
        run: npm run test:admin
      - name: Tests ausführen
        run: CI=true npm test -- --watchAll=false
      - name: Produktionsversion bauen
        run: npm run build

  promote:
    needs: [normalize, content-quality]
    if: needs.content-quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Technischen Pull Request übernehmen
        id: merge
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ needs.normalize.outputs.head }}
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:cms-content`,
              base: 'master',
            });
            const pull = pulls.data[0] ?? (await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'cms-content',
              base: 'master',
              title: 'Inhalt veröffentlichen',
              body: 'Automatisch geprüfte Inhaltsänderung aus dem CMS.',
            })).data;

            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                sha: process.env.HEAD_SHA,
                merge_method: 'merge',
              });
              if (!result.data.merged) throw new Error(result.data.message);
            } catch (error) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'continue-content-publish',
              });
              core.setFailed(`Übernahme wird mit aktuellem master wiederholt: ${error.message}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              context: 'vtfalte/content-publish',
              state: 'success',
              description: 'Veröffentlicht',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-pages',
            });

  restore:
    needs: [normalize, content-quality]
    if: always() && needs.normalize.result == 'success' && needs.content-quality.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cms-content
          fetch-depth: 0
      - name: Fehlgeschlagenen Stand zurücknehmen
        id: restore
        env:
          CHECKED_SHA: ${{ needs.normalize.outputs.head }}
        run: |
          git fetch origin master
          current=$(git rev-parse HEAD)
          if [ "$current" != "$CHECKED_SHA" ]; then
            echo "Aktueller Puffer wurde bereits geändert; spätere Prüfung übernimmt."
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tree=$(git rev-parse origin/master^{tree})
          restored=$(printf '%s\n' 'chore: revert invalid CMS change' | git commit-tree "$tree" -p HEAD)
          git push origin "$restored":cms-content
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "restored_sha=$restored" >> "$GITHUB_OUTPUT"
      - name: Rücknahme melden
        if: steps.restore.outputs.restored == 'true'
        uses: actions/github-script@v8
        env:
          FAILED_SHA: ${{ needs.normalize.outputs.head }}
          RESTORED_SHA: ${{ steps.restore.outputs.restored_sha }}
        with:
          script: |
            const status = sha => github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              context: 'vtfalte/content-publish',
              state: 'failure',
              description: 'Ungültige Änderung wurde zurückgenommen',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await status(process.env.FAILED_SHA);
            await status(process.env.RESTORED_SHA);
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:cms-content`,
              base: 'master',
            });
            for (const pull of pulls.data) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: 'closed',
              });
            }
