backend:
  name: github
  repo: oliverpetschick/vtfalte
  branch: cms-content
  base_url: __CMS_OAUTH_URL__
  auth_endpoint: auth
  auth_scope: public_repo
  site_domain: www.vtfalte.de
  squash_merges: true
  use_graphql: true
  cms_label_prefix: decap-cms/

local_backend: true

publish_mode: simple
locale: de
site_url: https://www.vtfalte.de
display_url: https://www.vtfalte.de
show_preview_links: false
editor:
  preview: false
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

media_folder: src/images/uploads
public_folder: images/uploads
collections:
  - name: locations
    label: Standorte
    label_singular: Eintrag hinzufügen
    folder: src/content/locations
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}'
    summary: '{{address}} · {{usage}} · Galerie {{galleryOrder}}'
    sortable_fields:
      - { field: galleryOrder, label: Galerie-Position, default_sort: asc }
      - { field: address, label: Adresse }
      - { field: category, label: Kategorie }
    view_groups:
      - { label: Kategorie, field: category }
    fields:
      - { name: title, label: Interner Titel, widget: hidden, default: Standort }
      - label: Galerie-Position
        name: galleryOrder
        widget: number
        value_type: float
        required: false
      - label: Kategorie
        name: category
        widget: vt_category
      - label: Koordinaten
        name: coordinates
        widget: vt_coordinates
        hint: Koordinaten einfügen oder den Marker auf der Karte verschieben.
      - { name: address, label: Adresse, widget: string, required: false }
      - { name: type, label: Typ, widget: string, required: false }
      - { name: usage, label: Nutzung, widget: string, required: false }
      - { name: formerUsage, label: Ehemalige Nutzung, widget: string, required: false }
      - { name: condition, label: Zustand, widget: string, required: false }
      - label: Fotos
        name: photos
        widget: list
        required: false
        default: []
        summary: '{{fields.credit}}'
        fields:
          - label: Bild
            name: src
            widget: image
            choose_url: false
            media_folder: /src/images/folds/fold_{{filename}}
            public_folder: images/folds/fold_{{filename}}
          - { name: credit, label: Bildquelle, widget: string, default: Johanna Knigge }
      - label: Links
        name: links
        widget: list
        required: false
        default: []
        summary: '{{fields.url}}'
        fields:
          - { name: url, label: Vollständige Webadresse, widget: string, pattern: ['^https?://.+$', 'Bitte eine vollständige http(s)-Adresse eingeben.'] }
